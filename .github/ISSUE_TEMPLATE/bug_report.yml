name: Bug Report
description: Report a bug, test failure, or unexpected behaviour in PromptEngine
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below.
        For security vulnerabilities, please refer to our [Security Policy](https://github.com/LordCodex/promptengine/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps or terminal command to reproduce the issue.
      placeholder: |
        1. Run 'promptengine init'
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Stack Trace
      description: Please copy-paste any relevant CLI logs or error messages.
      placeholder: Logs...
  - type: input
    id: version
    attributes:
      label: PromptEngine Version
      description: Run 'promptengine version' to retrieve the details.
      placeholder: e.g. PromptEngine v0.1.0-alpha (commit: a1b2c3d)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
