name: Validate Examples

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Verify PHP Syntax
        run: |
          find examples/php-laravel-sandbox/app -name "*.php" -print0 | xargs -0 -n 1 -P 4 php -l

  validate-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vue validation dependency
        working-directory: examples/js-vue-sandbox
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Validate Vue SFC syntax
        working-directory: examples/js-vue-sandbox
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { parse, compileScript } = require('@vue/compiler-sfc');

          for (const name of fs.readdirSync('src').filter((file) => file.endsWith('.vue'))) {
            const filename = path.join('src', name);
            const source = fs.readFileSync(filename, 'utf8');
            const { descriptor, errors } = parse(source, { filename });
            if (errors.length > 0) {
              console.error(errors);
              process.exitCode = 1;
              continue;
            }
            if (descriptor.scriptSetup) {
              try {
                compileScript(descriptor, { id: filename });
              } catch (error) {
                console.error(error);
                process.exitCode = 1;
              }
            }
          }
          NODE

  validate-dart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: examples/dart-flutter-sandbox
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: examples/dart-flutter-sandbox
        run: flutter analyze
