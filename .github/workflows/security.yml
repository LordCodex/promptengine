name: Security Hardening Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1' # Runs weekly on Mondays at 4:00 AM UTC

jobs:
  vulncheck:
    name: Vulnerability Verification (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Patched Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck analysis
        run: govulncheck ./...
