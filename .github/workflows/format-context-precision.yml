name: Format Context Precision Branch

on:
  push:
    branches:
      - fix/context-precision

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-precision
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Format Go source
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.go' '**/*.go'
          git commit -m "style: apply gofmt"
          git push origin HEAD:fix/context-precision
