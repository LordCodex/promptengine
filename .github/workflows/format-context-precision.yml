name: Format Context Precision Branch

on:
  push:
    branches:
      - fix/context-precision

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-precision
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Wire inferred task domains
        shell: python
        run: |
          from pathlib import Path

          path = Path("internal/domain/context/engine.go")
          text = path.read_text()
          old = '''		// Explicit task mappings are authoritative. These are the core standards,
		// workflows and checklists the PromptEngine knowledge manifest says are
		// required for the task.
		for _, playbook := range e.manifest.PlaybooksByTask(string(req.TaskType)) {
			addPath(playbook.Location, ContextStandard, 90, "PromptEngine manifest requires this playbook for the task.")
			items = append(items, ContextItem{Path: playbook.ID, Type: ContextManifestEntry, RelevanceScore: 70, Reason: "Required PromptEngine playbook mapping."})
		}

		// Optional mappings are deliberately below the inclusion threshold. They
		// enter the package only when task intent or another ranking signal makes
		// them materially relevant.
		for _, playbook := range e.manifest.OptionalPlaybooksByTask(string(req.TaskType)) {
			addPath(playbook.Location, ContextStandard, 45, "Optional PromptEngine playbook candidate for this task.")
		}
'''
          new = '''		// Explicit task mappings are authoritative. The primary task is preserved,
		// while deterministic domain inference can activate more specific standards
		// (for example API + payment rules for a generic feature request).
		for _, taskType := range inferredTaskTypes(req) {
			for _, playbook := range e.manifest.PlaybooksByTask(taskType) {
				addPath(playbook.Location, ContextStandard, 90, "PromptEngine manifest requires this playbook for the task domain: "+taskType+".")
				items = append(items, ContextItem{Path: playbook.ID, Type: ContextManifestEntry, RelevanceScore: 70, Reason: "Required PromptEngine playbook mapping for task domain: " + taskType + "."})
			}

			// Optional mappings are deliberately below the inclusion threshold. They
			// enter the package only when task intent or another ranking signal makes
			// them materially relevant.
			for _, playbook := range e.manifest.OptionalPlaybooksByTask(taskType) {
				addPath(playbook.Location, ContextStandard, 45, "Optional PromptEngine playbook candidate for task domain: "+taskType+".")
			}
		}
'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif "for _, taskType := range inferredTaskTypes(req)" not in text:
              raise SystemExit("expected context selection block not found")
      - name: Format Go source
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.go' '**/*.go'
          git commit -m "fix: wire inferred task domains and apply gofmt"
          git push origin HEAD:fix/context-precision
