  core/13-cicd-and-deployment-standard.md:
    classification: ADD
    owner: universal
    target: docs/CI-CD.md
    disposition: fallback_until_migrated
    corrections_before_merge:
      - Do not require one CI provider.
      - Do not require containers for every deployment.
      - Do not prohibit all manual production intervention; require controlled, audited break-glass procedures when necessary.
      - Do not impose a universal ban on down migrations; use data-loss-aware rollback/roll-forward strategy.
  core/14-infrastructure-and-devops-standard.md:
    classification: ADD
    owner: universal
    target: docs/INFRASTRUCTURE.md
    disposition: fallback_until_migrated
    corrections_before_merge:
      - Do not mandate Ubuntu/Alpine, Nginx, UFW, Supervisor, PM2, Docker Compose, or specific cloud products universally.
      - Do not treat changing the SSH port as a primary security control.
      - Do not use arbitrary traffic thresholds to justify Kubernetes.
      - Choose infrastructure from workload, failure, ownership, compliance, and operational requirements.
