version: 1
updated_at: 2026-09-02
policy:
  classifications: [KEEP, ADD, MERGE, UPDATE, REFERENCE, CONFLICT]
  invariant: >-
    Never remove an existing PromptEngine rule merely because an authoritative source
    covers a similar topic. Unique implementation or integration value must first be
    migrated to the appropriate owner; exact duplicates may then become references.
  public_private_boundary: >-
    Never vendor private authoritative repository content into this public repository.
    PromptEngine may resolve and synchronize it at runtime for an authorized user.

ownership_groups:
  promptengine_owned:
    classification: KEEP
    patterns:
      - ai/**
      - workflows/**
      - prompts/**
      - project/**
      - checklists/**
      - decision-guides/**
      - guides/**
      - cli/**
      - architecture/**
      - legacy/**
      - environment/**
    reason: PromptEngine orchestration, workflow, project-bootstrap, adapter, and decision-support knowledge.

  cross_stack_bridges:
    classification: KEEP
    patterns:
      - bridges/**
    reason: Cross-stack integration belongs to PromptEngine, but bridge documents must reference authoritative framework rules and must not restate stale framework policy.

  design_library:
    classification: KEEP
    patterns:
      - design/**
    reason: Product/design-system guidance is currently PromptEngine-owned because no separate authoritative design repository exists.

