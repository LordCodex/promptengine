id: laravel
version: 1
match:
  required_technologies: [php, laravel]
inheritance: [universal, php, laravel]
presentation:
  backend_authority: laravel
  integration: ""
  frontend: ""
required_rule_entrypoints:
  universal: [RULES.md]
  php: [AGENTS.md]
  laravel: [RULES.md, docs/ARCHITECTURE.md, docs/SECURITY.md, docs/TESTING.md]
resolution_policy:
  project_rules_last: true
  select_task_relevant_rules: true
  concatenate_entire_repositories: false
  preserve_promptengine_bridges: true
  preserve_project_specific_rules: true
precedence: [universal-invariants, php-implementation, laravel-framework, project-specific-decisions]
notes:
  - Laravel framework-native conventions specialize PHP and universal rules.
