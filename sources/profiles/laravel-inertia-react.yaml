id: laravel-inertia-react
version: 1
match:
  required_technologies: [php, laravel, inertia, react]
inheritance: [universal, php, laravel, react]
presentation:
  backend_authority: laravel
  integration: inertia-laravel
  frontend: react
required_rule_entrypoints:
  universal: [RULES.md]
  php: [AGENTS.md]
  laravel: [RULES.md, docs/INERTIA.md, docs/FEATURE-BOUNDARIES.md, docs/COMPONENTS.md]
  react: [RULES.md]
resolution_policy:
  project_rules_last: true
  select_task_relevant_rules: true
  concatenate_entire_repositories: false
  preserve_promptengine_bridges: true
  preserve_project_specific_rules: true
precedence: [universal-invariants, php-implementation, laravel-server-authority, inertia-integration, react-frontend-implementation, project-specific-decisions]
notes:
  - Laravel remains authoritative for authentication, authorization, validation, transactions, persistence, queues, security, and business invariants.
  - Inertia governs the Laravel-to-React page, prop, form, navigation, partial reload, and SSR boundary.
  - React rules govern React components, hooks, state, rendering, and frontend testing conventions.
