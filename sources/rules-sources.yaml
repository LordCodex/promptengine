version: 1
updated_at: 2026-09-02

# PromptEngine is the orchestration layer. These repositories own the canonical
# engineering rules for their scope. Local PromptEngine playbooks remain valid
# preservation/fallback material until a deliberate deprecation removes them.
sources:
  universal:
    repository: LordCodex/engineering-ai-rules
    ref: 4cf47616a5437530b8848d8aa834acc9b08b7cd6
    role: authoritative
    owns:
      - universal
      - architecture
      - security
      - reliability
      - api-design
      - authentication
      - authorization
      - threat-modeling
      - collaboration
      - ci-cd
      - infrastructure
      - legacy-modernization
      - code-review
      - documentation
    inherits: []

  php:
    repository: LordCodex/php-broilerplate
    ref: ac860c73104ce47ab335e64cd6fe9c9f7f59b697
    role: authoritative
    owns:
      - php
      - php-language-runtime
    inherits:
      - universal

  laravel:
    repository: LordCodex/laravel-ai-rules
    ref: 8b03da4ee01879ba8a896811304bf7984ecda1f4
    role: authoritative
    owns:
      - laravel
      - blade
      - livewire
      - inertia-laravel
    inherits:
      - php

  vue:
    repository: LordCodex/vue-ai-rules
    ref: d79364cd9fc49aaf7907866ac21aa2e3f93a5790
    role: authoritative
    owns:
      - vue
      - vue-typescript
      - vue-i18n
    inherits:
      - universal

  react:
    repository: LordCodex/react-ai-rules
    ref: 3011fa35389fabfaf4325bff77e4cbee973e4a35
    role: authoritative
    owns:
      - react
      - react-typescript
      - react-i18n
    inherits:
      - universal

promptengine:
  role: orchestrator
  owns:
    - stack-detection
    - rule-resolution
    - task-context-selection
    - workflows
    - prompts
    - project-knowledge
    - cli
    - ai-adapters
    - cross-stack-bridges
    - unsupported-stack-fallbacks

preservation_policy:
  classifications:
    - KEEP
    - ADD
    - MERGE
    - UPDATE
    - REFERENCE
    - CONFLICT
  invariant: >-
    Never remove an existing PromptEngine rule merely because a similar
    authoritative rule exists. First compare it semantically. Preserve local
    implementation value, migrate missing knowledge to the correct owner, and
    only replace exact duplication with an explicit reference.
