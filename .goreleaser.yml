version: 2

project_name: promptengine

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: promptengine
    main: ./cmd/promptengine
    binary: promptengine
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/LordCodex/promptengine/internal/version.Version={{.Version}}
      - -X github.com/LordCodex/promptengine/internal/version.Commit={{.Commit}}
      - -X github.com/LordCodex/promptengine/internal/version.Date={{.Date}}

archives:
  - id: default
    builds:
      - promptengine
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: LordCodex
    name: promptengine
